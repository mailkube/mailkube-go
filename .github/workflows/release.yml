name: Release

# Conventional-Commits-driven release: one tag + one GitHub Release, and NOTHING committed
# back to `main`.
# There is no publish job — pkg.go.dev indexes the module automatically from its `vX.Y.Z` git tags.
on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci-gate:
    # Release only proceeds if the full gated CI (test + dry + docs) is green.
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci-gate
    runs-on: ubuntu-latest
    environment: release
    permissions:
      # A job-level block REPLACES the defaults rather than adding to them, so every scope
      # semantic-release needs has to be listed. @semantic-release/github comments on the PRs and
      # issues resolved by a release and adds the `released` label; without the two write scopes
      # below those calls 403 and the run ends red *after* the tag and Release already exist.
      contents: write # push the tag, create the GitHub Release
      issues: write # successComment on resolved issues
      pull-requests: write # successComment + the `released` label on resolved PRs
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      # Creates the TAG and the GitHub Release, and nothing else. No `@semantic-release/git`
      # and no `@semantic-release/changelog` on purpose: a bot commit to `main` would be
      # rejected by the branch ruleset, and github-actions[bot] cannot be added to a ruleset
      # bypass list. The release notes are the changelog. See .rules/RELEASE.md.
      # The major is pinned on purpose. This repo can sit untouched for months, and an
      # unpinned `npx semantic-release` resolves @latest at run time:
      # a new major could change the config schema or raise the Node floor above the version
      # pinned in setup-node, breaking releases with no change in the repo. Dependabot cannot
      # see this dependency — there is no manifest — so bumping it is a manual task.
      - name: Release (semantic-release — tag + GitHub Release, no commit, no registry publish)
        run: >-
          npx --yes
          -p semantic-release@24
          semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
