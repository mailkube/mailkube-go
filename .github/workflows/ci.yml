name: CI

on:
  # No `push: branches: [main]` trigger on purpose. release.yml already runs this entire workflow
  # through `workflow_call` on every push to `main`, and both runs land in the same
  # `ci-${{ github.ref }}` concurrency group with cancel-in-progress. A direct trigger therefore
  # only ever races the gated one: one of the two is cancelled, and the cancelled run is what the
  # README's CI badge reports. `main` stays fully covered by release.yml's ci-gate job.
  pull_request:
  workflow_call: # so release.yml can gate on the full CI

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.23", "1.24"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Download modules
        run: go mod download

      - name: Lint (golangci-lint — complexity, docs, SOLID smells, staticcheck)
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.1.6

      - name: Format check (gofumpt)
        run: |
          go install mvdan.cc/gofumpt@v0.7.0
          if [ -n "$(gofumpt -l .)" ]; then
            echo "gofumpt: the following files need formatting:"
            gofumpt -l .
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Module manifest check (publish readiness)
        # A Go module is published straight from the tagged tree, so go.mod *is* the manifest and
        # nothing validates it at release time — there is no `publish --dry-run` step to fail. An
        # untidy or unverifiable go.mod would only surface once a consumer ran `go get`, and the
        # proxy caches a bad version immutably. Check it on every PR instead.
        run: |
          go mod verify
          go mod tidy -diff
          go list -m

      - name: Compile the examples
        # Examples carry `//go:build ignore` so they stay out of the module, out of `go vet` and
        # out of the coverage denominator — which also means `go build ./...` never type-checks
        # them. Compile each one explicitly so an API change cannot silently rot the docs. One
        # file at a time, because they are all `package main` in one directory.
        run: |
          n=$(ls examples/*.go | wc -l)
          test "$n" -ge 13 || { echo "expected >=13 examples, found $n"; exit 1; }
          for example in examples/*.go; do
            go build -o /dev/null "$example" || exit 1
          done

      - name: Lint the examples (golangci-lint)
        # Same reason compiling them needs its own step: `//go:build ignore` keeps them out of the
        # package, so the golangci-lint-action run above never sees them. Naming a file explicitly
        # makes the toolchain ignore its build constraints, exactly as `go build file.go` does —
        # so this needs NO `--build-tags ignore`, and must not have one: `ignore` is a live build
        # tag inside the Go standard library, and setting it corrupts stdlib type-checking.
        # A separate `run:` step because the action cannot express a loop — and the action does
        # NOT put its binary on PATH, so this installs its own copy. Keep the version in step with
        # the `golangci/golangci-lint-action` pin above.
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.1.6
          for example in examples/*.go; do
            golangci-lint run "$example" || exit 1
          done

      - name: Tests + coverage
        run: go test ./... -race -covermode=atomic -coverprofile=coverage.out

      - name: Coverage gate (90% line)
        run: ./scripts/check-coverage.sh coverage.out

  dry:
    # Language-agnostic duplication (DRY) gate — identical across every mailkube repo.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Copy-paste detection (jscpd)
        run: npx --yes jscpd@4 --config .jscpd.json .
      # Examples are excluded from the run above and measured here instead, at a higher
      # minTokens. Every example repeats the same scaffolding — import, read MAILKUBE_FROM,
      # construct the client, handle the error — and deduping that into a shared helper is
      # impossible anyway: each example is its own `package main` compiled on its own. 100 tokens
      # is past that boilerplate (the cliff is at 90) while still catching a copy-pasted example.
      - name: Copy-paste detection across examples (jscpd)
        run: npx --yes jscpd@4 --config .jscpd.examples.json examples/

  docs:
    # Governance gate: every .rules/*.md must be indexed in AGENTS.md.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Rule-index sync check
        run: ./scripts/check-rule-index.sh
