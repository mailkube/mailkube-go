name: PR Title

# Enforce Conventional Commits on the PR title, since PRs are squash-merged using it.
# Only `feat:`, `fix:`, and `perf:` trigger a release on `main`.
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional-title:
    # The status check GitHub publishes is named after the JOB, not the workflow. Without this
    # `name:` it would be reported as `conventional-title`, while the branch-protection setup
    # instructions tell maintainers to require a check called `PR-title` — a name that would never
    # arrive, blocking every PR forever. Renaming the job here is the cheaper half of the fix.
    name: PR-title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
