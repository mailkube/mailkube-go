# Run `pre-commit install && pre-commit install --hook-type commit-msg` after cloning.
# Requires the Go toolchain, golangci-lint (v2), gofumpt, and Node (for jscpd) on PATH.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: gofumpt
        name: gofumpt (format)
        entry: gofumpt -w
        language: system
        types: [go]
      - id: golangci-lint
        name: golangci-lint
        entry: golangci-lint run
        language: system
        types: [go]
        pass_filenames: false
      # The hook above runs in package mode, so `//go:build ignore` hides every example from it.
      # This one names each changed example explicitly, which is what makes the toolchain ignore
      # the constraint — the same thing CI's per-file loop does. No `--build-tags ignore`:
      # `ignore` is a live build tag in the Go standard library.
      - id: golangci-lint-examples
        name: golangci-lint (examples, per file)
        entry: golangci-lint run
        language: system
        files: ^examples/.*\.go$
      - id: examples-compile
        name: examples compile (go build)
        entry: go build -o /dev/null
        language: system
        files: ^examples/.*\.go$

  # Language-agnostic DRY gate — identical config in every mailkube repo.
  - repo: local
    hooks:
      - id: jscpd
        name: jscpd (copy-paste detector)
        entry: npx --yes jscpd@4 --config .jscpd.json .
        language: system
        pass_filenames: false
      - id: jscpd-examples
        name: jscpd (examples, higher threshold)
        entry: npx --yes jscpd@4 --config .jscpd.examples.json examples/
        language: system
        pass_filenames: false

  # Enforce Conventional Commits on the commit message (matches the org house style).
  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v9.22.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
        additional_dependencies:
          - "@commitlint/config-conventional"
